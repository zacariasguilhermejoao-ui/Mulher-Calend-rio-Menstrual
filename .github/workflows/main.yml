name: Build Android AAB + APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos do aplicativo
        run: |
          mkdir -p www
          cp index.html www/
          cp sw.js www/
          cp manifest.json www/
          cp enviar-push-exemplo.js www/ || true

          if [ -d "icons" ]; then
            cp -r icons www/
          fi

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Garantir Android API 36
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle
          fi

      - name: Gerar AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Gerar APK para instalar no Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: mulher-calendario-menstrual-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: mulher-calendario-menstrual-apk
          path: android/app/build/outputs/apk/debug/*.apk
