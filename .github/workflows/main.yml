name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Instalar gerador de ícones
        run: npm install --no-save @capacitor/assets

      - name: Preparar Android
        run: bash prepare-android.sh

      - name: Preparar ícone do app
        run: |
          mkdir -p assets
          cp app-icon.png assets/icon.png

      - name: Gerar ícones Android
        run: npx @capacitor/assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Garantir API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit("android/variables.gradle não encontrado.")

          s = p.read_text()
          s = s.replace("compileSdkVersion = 35", "compileSdkVersion = 36")
          s = s.replace("targetSdkVersion = 35", "targetSdkVersion = 36")
          p.write_text(s)

          print("API 36 configurada.")
          PY

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Criar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Criar AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-app-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
